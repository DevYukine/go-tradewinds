name: tradewinds

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradewinds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tradewinds
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - tradewinds-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradewinds -d tradewinds"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  tradewinds-data:
